{% extends 'base.html' %}{% block content %}<h1>Processed logs</h1><form method="get"><label>Label <select name="label"><option value="">All</option>{% for l in ['normal','brute_force','sql_injection','scanning'] %}<option value="{{l}}" {% if selected==l %}selected{% endif %}>{{l}}</option>{% endfor %}</select></label><button>Filter</button></form><table><thead><tr><th>Time</th><th>IP</th><th>Path</th><th>Status</th><th>Label</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{r.timestamp}}</td><td>{{r.source_ip}}</td><td>{{r.request_path}}</td><td>{{r.status_code}}</td><td>{{r.label}}</td></tr>{% else %}<tr><td colspan="5">No processed rows.</td></tr>{% endfor %}</tbody></table>{% endblock %}
