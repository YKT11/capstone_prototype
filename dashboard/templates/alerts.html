{% extends 'base.html' %}{% block content %}<h1>Detection comparison</h1><table><thead><tr><th>IP</th><th>Rule-based</th><th>ML</th><th>Risk</th><th>Explanation</th><th>Disagreement</th></tr></thead><tbody>{% for a in alerts %}<tr><td>{{a.source_ip}}</td><td>{{a.rule_label}}</td><td>{{a.ml_label}}</td><td><span class="badge {{a.risk|lower}}">{{a.risk}}</span></td><td>{{a.explanation}}</td><td>{{'Yes' if a.disagreement else 'No'}}</td></tr>{% else %}<tr><td colspan="6">No alerts yet.</td></tr>{% endfor %}</tbody></table>{% endblock %}
